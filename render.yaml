services:
  - type: web
    name: bug-poet
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install && npm run build
    startCommand: cd backend && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.siliconflow.cn/v1
      - key: MODEL_NAME
        value: Qwen/Qwen2.5-7B-Instruct
